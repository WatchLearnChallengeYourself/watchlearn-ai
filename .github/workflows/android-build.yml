name: Build WatchLearn AI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      WATCHLEARN_KEYSTORE_BASE64: ${{ secrets.WATCHLEARN_KEYSTORE_BASE64 }}
      WATCHLEARN_KEYSTORE_PASSWORD: ${{ secrets.WATCHLEARN_KEYSTORE_PASSWORD }}
      WATCHLEARN_KEY_ALIAS: ${{ secrets.WATCHLEARN_KEY_ALIAS }}
      WATCHLEARN_KEY_PASSWORD: ${{ secrets.WATCHLEARN_KEY_PASSWORD }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android build packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Verify permanent signing secrets
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          test -n "$WATCHLEARN_KEYSTORE_BASE64"
          test -n "$WATCHLEARN_KEYSTORE_PASSWORD"
          test -n "$WATCHLEARN_KEY_ALIAS"
          test -n "$WATCHLEARN_KEY_PASSWORD"

      - name: Run lint and build personal sideload APK
        run: gradle --no-daemon :app:lintPersonalDebug :app:assemblePersonalDebug

      - name: Build Play Store release bundle
        run: gradle --no-daemon :app:bundlePlayStoreRelease

      - name: Prepare distribution files
        shell: bash
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/personal/debug/app-personal-debug.apk artifacts/watchlearn-ai-personal-sideload.apk
          cp app/build/outputs/bundle/playStoreRelease/app-playStore-release.aab artifacts/watchlearn-ai-play-store.aab

      - name: Upload personal APK and Play Store AAB
        uses: actions/upload-artifact@v4
        with:
          name: watchlearn-ai-distributions
          path: artifacts/*
          if-no-files-found: error
